name: Portfolio Tracker News

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch news
        run: node scripts/fetch-portfolio-news.js

      - name: Commit news.json if changed
        run: |
          if git diff --quiet -- portfolio-tracker/news.json; then
            echo "No news changes, skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio-tracker/news.json
          git commit -m "Update portfolio-tracker news.json [skip ci]"
          git push
